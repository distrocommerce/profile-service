# Local kind cluster "distro". Release name: profile, namespace: apps.
# Only what is specific to the local environment; shared defaults are in values.yaml.
#
# auth.audiences (the ZITADEL project ID) is not committed: it changes after
# an infra reset. Pass it as a string at deploy time:
#   --set-string 'auth.audiences={<project id>}'

# DATABASE_URL, created in the infra repo by `make db-secrets`.
envFromSecret: profile-db

route:
  host: api.localtest.me
  pathPrefix: /v1/users

auth:
  issuer: http://auth.localtest.me:8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
