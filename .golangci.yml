version: "2"

run:
  timeout: 3m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: receiver-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests build SQL from a generated schema name (gosec) and use
      # httptest.NewRequest, whose context is fine for a test (noctx).
      - path: _test\.go
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/distrocommerce/profile-service
